apiVersion: v1
kind: Secret
metadata:
  name: lastoasis-config
  namespace: last-oasis
type: Opaque
stringData:
  SERVER_CUSTOMER_KEY: "REPLACE_ME"
  SERVER_PROVIDER_KEY: "REPLACE_ME"
  SERVER_IP_ADDRESS:   "REPLACE_ME"
  SERVER_IDENTIFIER:   "oasis-01"
  SERVER_PORT:         "62001"
  SERVER_QUERY_PORT:   "27015"
  SERVER_SLOTS:        "25"
  STEAM_USER:          "anonymous"
