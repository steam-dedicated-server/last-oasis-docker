apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastoasis-server
spec:
  replicas: 1
  strategy:
    type: Recreate                       # PVC is RWO + hostPort claim; never run two pods
  selector:
    matchLabels:
      app: lastoasis-server
  template:
    metadata:
      labels:
        app: lastoasis-server
    spec:
      # Optional: pin to a specific node when running multiple
      # oasis maps across a cluster. Drop or change the value.
      # nodeSelector:
      #   oasis: lastoasis-server

      hostNetwork: true                  # game ports come straight off the node IP
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60  # let MistServer flush saves on SIGTERM

      # Match the image's `steam` user (UID 1000, GID 1001).
      # fsGroup must live at pod level — not on the container.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1001
        fsGroup: 1001

      initContainers:
        # PVCs are often provisioned root-owned; fix that before the
        # main container starts so steamcmd / MistServer can write.
        - name: fix-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /mnt/steam/backups
              chown -R 1000:1001 /mnt/steam
              chmod -R 775 /mnt/steam
          volumeMounts:
            - name: data
              mountPath: /mnt/steam

      containers:
        - name: server
          image: ghcr.io/steam-dedicated-server/last-oasis-docker:latest
          imagePullPolicy: Always
          args: ["run"]
          envFrom:
            - secretRef:
                name: lastoasis-config
          ports:
            - { name: game,     containerPort: 62001, protocol: UDP, hostPort: 62001 }
            - { name: game-tcp, containerPort: 62001, protocol: TCP, hostPort: 62001 }
            - { name: query,    containerPort: 27015, protocol: UDP, hostPort: 27015 }
          resources:
            requests: { cpu: "2",   memory: "3Gi" }
            limits:   { cpu: "3.5", memory: "5Gi" }
          securityContext:
            seccompProfile: { type: Unconfined }
            # SYS_NICE lets the entry-point renice MistServer to -5
            # so the game thread wins scheduler conflicts on busy
            # nodes. Without it the renice silently no-ops.
            capabilities:
              add: ["SYS_NICE"]
          startupProbe:
            exec: { command: ["python3", "/opt/lastoasis/healthcheck.py"] }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["python3", "/opt/lastoasis/healthcheck.py"] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec: { command: ["python3", "/opt/lastoasis/healthcheck.py"] }
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /mnt/steam

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lastoasis-data
