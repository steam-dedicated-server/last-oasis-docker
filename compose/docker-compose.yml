# ============================================================
# Last Oasis — single-server production compose
# ------------------------------------------------------------
# Tuned for a small VPS: ~4 vCPU / 6 GB RAM / 60 GB SSD.
#
# Quick start:
#   1. Edit the <REPLACE_*> placeholders in the `environment` block
#      (or use an .env file at compose dir).
#   2. docker compose --profile maintenance run --rm install
#   3. docker compose up -d server
#   4. docker compose logs -f server
#
# Day-to-day:
#   docker compose --profile maintenance run --rm update
#   docker compose --profile maintenance run --rm backup
#   docker compose ps                  # health
#   docker compose down                # stop
# ============================================================

x-image: &image
  image: ghcr.io/steam-dedicated-server/last-oasis-docker:latest
  # To build locally instead:
  # build:
  #   context: ..
  #   dockerfile: docker/Dockerfile

x-common: &common
  <<: *image
  restart: unless-stopped
  stop_grace_period: 60s
  init: false                           # tini is baked into the image
  security_opt:
    - seccomp:unconfined                # steamcmd uses syscalls blocked by the default profile
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
    nproc: 65535
  volumes:
    - lastoasis-data:/mnt/steam
  tmpfs:
    - /tmp:size=256m
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-env: &env
  # ---- REQUIRED ----
  SERVER_CUSTOMER_KEY: "<REPLACE_CUSTOMER_KEY>"
  SERVER_PROVIDER_KEY: "<REPLACE_PROVIDER_KEY>"
  SERVER_IP_ADDRESS:   "<REPLACE_EXTERNAL_IP>"
  SERVER_IDENTIFIER:   "<REPLACE_SERVER_NAME>"
  # ---- TUNING ----
  SERVER_SLOTS:        "25"
  SERVER_PORT:         "62001"
  SERVER_QUERY_PORT:   "27015"
  STEAM_USER:          "anonymous"

services:
  # ----- maintenance (one-shot, --profile maintenance) -----
  install:
    <<: *common
    profiles: ["maintenance"]
    restart: "no"
    command: ["install"]
    environment: *env

  update:
    <<: *common
    profiles: ["maintenance"]
    restart: "no"
    command: ["update"]
    environment: *env

  backup:
    <<: *common
    profiles: ["maintenance"]
    restart: "no"
    command: ["backup"]
    environment: *env

  # ----- the actual game server -----
  server:
    <<: *common
    command: ["run"]
    environment: *env
    ports:
      - "62001:62001/udp"
      - "62001:62001/tcp"
      - "27015:27015/udp"
      - "27015:27015/tcp"
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 5G
        reservations:
          cpus: "2.0"
          memory: 3G
    healthcheck:
      test: ["CMD", "python3", "/opt/lastoasis/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  lastoasis-data:
    driver: local
